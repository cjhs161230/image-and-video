<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图像与视频工作台</title>
  </head>
  <body>
    <main id="app">
      <h1>图像与视频工作台</h1>
      <nav aria-label="主导航">
        <a href="#image-workbench">图片工作台</a>
        <a href="#video-projects">视频项目</a>
        <a href="#history">历史</a>
        <a href="#settings">设置</a>
      </nav>

      <section id="image-workbench" data-page="图片工作台">
        <h2>图片工作台</h2>
        <form>
          <label>
            提示词
            <textarea name="prompt" placeholder="输入图片提示词"></textarea>
          </label>
          <label>
            模型
            <select name="model">
              <option>gpt-image-2</option>
              <option>wan2.7-image</option>
              <option>wan2.7-image-pro</option>
              <option>qwen-image-2.0</option>
              <option>qwen-image-2.0-pro</option>
            </select>
          </label>
          <p>积分估算：提交前根据模型、张数和尺寸估算。</p>
          <p>磁盘估算：提交前根据输出数量估算本地占用。</p>
          <button type="button">生成图片</button>
        </form>
      </section>

      <section id="video-projects" data-page="视频项目">
        <h2>视频项目</h2>
        <p>阶段统计：草稿、分镜、关键帧、连续帧、合成。</p>
        <p>帧级统计：已完成、缺失、需人工处理。</p>
        <div aria-label="任务控制">
          <button type="button">暂停</button>
          <button type="button">继续</button>
          <button type="button">取消</button>
        </div>
        <div aria-label="人工门禁">
          <button type="button">分镜确认</button>
          <button type="button">关键帧确认</button>
        </div>
      </section>

      <section id="history" data-page="历史">
        <h2>历史</h2>
        <label>
          筛选
          <select name="history-kind">
            <option>全部</option>
            <option>图片</option>
            <option>视频</option>
          </select>
        </label>
        <p>显示缩略图、封面、状态摘要和删除入口。</p>
      </section>

      <section id="settings" data-page="设置">
        <h2>设置</h2>
        <p>凭证配置状态：只显示是否已配置，不显示密钥内容。</p>
        <p>FFmpeg 路径、代理、并发和费率可在本地普通设置中维护。</p>
      </section>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
