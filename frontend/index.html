<!doctype html>
<html lang="zh-CN" data-theme="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片生成工作台</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260624-ui-pages" />
  </head>
  <body>
    <main id="app">
      <header>
        <p class="eyebrow">Windows 本地图像工具</p>
        <h1>图片生成工作台</h1>
        <p>当前默认聚焦图片生成、图生图、历史和设置；视频功能已归档。</p>
      </header>

      <nav aria-label="主导航">
        <a href="#image-workbench" data-nav-link="image-workbench">图片工作台</a>
        <a href="#history" data-nav-link="history">历史</a>
        <a href="#settings" data-nav-link="settings">设置</a>
      </nav>

      <section id="image-workbench" data-page="图片工作台">
        <h2>图片工作台</h2>
        <form id="image-job-form">
          <label>
            提示词
            <textarea name="prompt" required placeholder="输入图片提示词"></textarea>
          </label>
          <div class="form-grid">
            <label>
              模型
              <select name="model">
                <option>gpt-image-2</option>
                <option>wan2.7-image</option>
                <option>wan2.7-image-pro</option>
                <option>qwen-image-2.0</option>
                <option>qwen-image-2.0-pro</option>
              </select>
            </label>
            <label>
              输出数量
              <input name="n" type="number" value="1" min="1" max="4" />
            </label>
            <label>
              输出格式
              <select name="output_format">
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
                <option value="webp">WebP</option>
              </select>
            </label>
            <label>
              尺寸
              <input name="size" value="1024x1024" placeholder="1024x1024 或 auto" />
            </label>
            <label>
              质量
              <select name="quality">
                <option value="auto">auto</option>
                <option value="low">low</option>
                <option value="medium" selected>medium</option>
                <option value="high">high</option>
              </select>
            </label>
            <label>
              风格
              <select name="style">
                <option value="vivid" selected>vivid</option>
                <option value="natural">natural</option>
              </select>
            </label>
            <label>
              背景
              <select name="background">
                <option value="auto" selected>auto</option>
                <option value="transparent">transparent</option>
                <option value="opaque">opaque</option>
              </select>
            </label>
            <label>
              审核强度
              <select name="moderation">
                <option value="auto" selected>auto</option>
                <option value="low">low</option>
              </select>
            </label>
            <label>
              压缩质量
              <input
                name="output_compression"
                type="number"
                min="0"
                max="100"
                placeholder="仅 JPEG / WebP"
              />
            </label>
            <label>
              输入保真度
              <select name="input_fidelity">
                <option value="">自动</option>
                <option value="low">low</option>
                <option value="high">high</option>
              </select>
            </label>
            <label>
              Matsca 模式
              <select name="matsca_mode">
                <option value="direct">直连</option>
                <option value="native">原生</option>
              </select>
            </label>
          </div>
          <label>
            图生图输入
            <input
              id="image-input-files"
              name="image_input_files"
              type="file"
              accept="image/png,image/jpeg,image/webp"
              multiple
            />
          </label>
          <p class="helper-text">最多上传 8 张输入图；提交时会先转成受控 media_id。</p>
          <p id="image-upload-status"></p>
          <p id="image-cost-estimate">积分估算：1；磁盘估算：12 MB</p>
          <label class="inline-check">
            <input name="confirm_cost" type="checkbox" />
            确认成本
          </label>
          <button type="submit">生成图片</button>
        </form>

        <div id="job-panel" class="job-panel" hidden>
          <div><strong>任务状态：</strong><span id="job-status">queued</span></div>
          <div class="controls" aria-label="任务控制">
            <button type="button" data-action="pause">暂停</button>
            <button type="button" data-action="resume">继续</button>
            <button type="button" data-action="cancel">取消</button>
          </div>
          <p id="job-error" role="alert"></p>
          <div id="job-results" class="results"></div>
        </div>
      </section>

      <section id="history" data-page="历史">
        <h2>历史</h2>
        <div class="controls">
          <select id="history-kind" aria-label="历史类型">
            <option value="">全部</option>
            <option value="image">图片</option>
            <option value="video">视频</option>
          </select>
          <button id="refresh-history" type="button">刷新历史</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <section id="settings" data-page="设置">
        <h2>设置</h2>
        <button id="load-config-status" type="button">检查凭证配置状态</button>
        <pre id="config-status">尚未检查</pre>
        <form id="settings-form">
          <label>
            FFmpeg 路径
            <input name="ffmpeg_path" placeholder="D:/ffmpeg/ffmpeg.exe" />
          </label>
          <label>
            native 下载代理
            <input name="native_download_proxy" placeholder="http://127.0.0.1:7890" />
          </label>
          <label>
            图片每张积分费率
            <input name="cost_rate_image_per_image" type="number" min="0" step="0.01" />
          </label>
          <label>
            视频每帧积分费率
            <input name="cost_rate_video_per_frame" type="number" min="0" step="0.01" />
          </label>
          <label>
            界面背景
            <select id="theme-select" name="theme">
              <option value="theme-dark">深色默认</option>
              <option value="theme-light">清爽浅色</option>
            </select>
          </label>
          <button type="submit">保存设置</button>
        </form>
        <p id="settings-status"></p>
      </section>
    </main>
    <script type="module" src="/assets/js/app.js?v=20260624-ui-pages"></script>
  </body>
</html>
