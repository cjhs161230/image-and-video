      <section id="video-projects" data-page="视频项目">         <h2>视频项目</h2>         <form id="video-draft-form">           <label>             项目标题             <input name="title" required value="演示视频" />           </label>           <label>             视频描述             <textarea name="description" required placeholder="描述角色、场景和镜头"></textarea>           </label>           <div class="form-grid">             <label>               视频时长（秒）               <input name="duration_seconds" type="number" value="5" min="0.1" step="0.1" />             </label>             <label>               每秒帧数（FPS）               <input name="fps" type="number" value="24" min="1" max="60" />             </label>           </div>           <p id="video-frame-estimate">预计生成帧数：120；结束帧：119</p>           <div class="reference-toggle-row">             <button               type="button"               id="toggle-video-references"               aria-expanded="false"               aria-controls="reference-panel"             >               展开参考图             </button>             <span id="video-reference-summary">参考图：0/8</span>           </div>           <div id="reference-panel" class="reference-panel" hidden>             <div id="video-reference-inputs" class="reference-inputs"></div>             <p class="helper-text">               参考图上传：最多 8 张；可直接上传，也可继续手填已有 media_id。             </p>             <p id="video-upload-status"></p>           </div>           <p id="video-cost-estimate">积分估算：121；磁盘估算：1452 MB</p>           <label class="inline-check">             <input name="confirm_cost" type="checkbox" />             确认成本           </label>           <label class="inline-check">             <input name="confirm_high_cost" type="checkbox" />             高成本 / 高磁盘占用二次确认           </label>           <div class="controls">             <button type="submit">保存草稿</button>             <button type="button" id="generate-storyboard">生成分镜</button>             <button type="button" id="review-storyboard">AI 复审分镜</button>             <button type="button" id="confirm-storyboard">确认分镜</button>             <button type="button" id="generate-keyframes">生成关键帧</button>             <button type="button" id="confirm-keyframes">确认关键帧</button>             <button type="button" id="generate-frames">生成连续帧</button>             <button type="button" id="check-frame-issues">检查帧问题</button>             <button type="button" id="stitch-video">合成视频</button>           </div>         </form>         <div class="job-panel">           <div><strong>视频项目：</strong><span id="video-project-id">尚未创建</span></div>           <div><strong>视频任务：</strong><span id="video-job-status">尚无任务</span></div>           <div class="controls">             <button type="button" data-video-job-action="pause">暂停</button>             <button type="button" data-video-job-action="resume">继续</button>             <button type="button" data-video-job-action="cancel">取消</button>           </div>           <p id="video-failure-reason" role="alert">任务失败原因：暂无</p>           <p id="video-error" role="alert"></p>           <h3>分镜结果</h3>           <p class="helper-text">生成成功后会自动显示最新分镜；也可以在下方选择分镜版本。</p>           <div id="storyboard-versions" class="list-panel" aria-label="选择分镜版本"></div>           <div id="storyboard-board" class="review-board" aria-label="分镜看板">             <h4>分镜看板</h4>             <p class="helper-text">生成或选择分镜版本后，这里会显示关键帧、片段和 AI 建议。</p>           </div>           <pre id="video-summary">项目状态会显示在这里</pre>           <form id="storyboard-editor-form" class="storyboard-editor">             <label>               当前分镜 JSON               <textarea                 id="storyboard-plan-editor"                 name="storyboard_plan"                 placeholder="生成分镜成功后会自动填入；也可点击上方版本按钮查看"               ></textarea>             </label>             <label>               AI 建议 / 修改说明               <textarea                 id="storyboard-suggestion"                 name="storyboard_suggestion"                 placeholder="记录 AI 建议或人工修改说明"               ></textarea>             </label>             <button type="submit">应用分镜编辑</button>           </form>           <h3>关键帧结果</h3>           <p class="helper-text">确认关键帧前，请检查每张实际生成图是否符合分镜。</p>           <div id="keyframe-list" class="results"></div>           <h3>连续帧检查</h3>           <p id="frame-progress-summary" class="helper-text">尚未检查连续帧。</p>           <div id="frame-issues" class="list-panel"></div>         </div>       </section>
